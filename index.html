<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Picture This</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Ccircle cx='128' cy='128' r='104' fill='none' stroke='%23f97316' stroke-width='20'/%3E%3Cline x1='128' y1='24' x2='164.6' y2='134.8' stroke='%23f97316' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='37.9' y1='76' x2='152.1' y2='99.6' stroke='%23f97316' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='37.9' y1='180' x2='115.5' y2='93.2' stroke='%23f97316' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='128' y1='232' x2='91.4' y2='121.2' stroke='%23f97316' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='218.1' y1='180' x2='103.9' y2='156.4' stroke='%23f97316' stroke-width='18' stroke-linecap='round'/%3E%3Cline x1='218.1' y1='76' x2='140.5' y2='162.8' stroke='%23f97316' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Hidden File Inputs -->
  <input type="file" id="file-input" multiple accept="image/*" hidden />
  <input type="file" id="folder-input" webkitdirectory directory multiple hidden />

  <!-- Global Drag & Drop Overlay -->
  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-box">
      <i class="ph ph-folder-open"></i>
      <span>Drop photos or folders here</span>
    </div>
  </div>

  <!-- Home Screen -->
  <section id="home-screen" class="home-screen">
    <div class="home-center">
      <svg class="home-mark" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect class="anim-stroke" x="14" y="14" width="92" height="92" stroke="currentColor" stroke-width="2.5" />
        <circle class="anim-stroke" cx="60" cy="60" r="28" stroke="#f97316" stroke-width="2.5" />
        <line class="anim-stroke" x1="60" y1="14" x2="60" y2="24" stroke="currentColor" stroke-width="2" />
        <line class="anim-stroke" x1="60" y1="96" x2="60" y2="106" stroke="currentColor" stroke-width="2" />
        <line class="anim-stroke" x1="14" y1="60" x2="24" y2="60" stroke="currentColor" stroke-width="2" />
        <line class="anim-stroke" x1="96" y1="60" x2="106" y2="60" stroke="currentColor" stroke-width="2" />
      </svg>

      <h1 class="home-title">Picture This</h1>
      <p class="home-subtitle">Fast batch photo developing &amp; format conversion</p>

      <div class="home-actions">
        <button id="home-btn-photos" class="btn btn-primary">
          <i class="ph ph-images"></i>
          <span>Select Photos</span>
        </button>
        <button id="home-btn-folder" class="btn btn-secondary">
          <i class="ph ph-folder-notch-open"></i>
          <span>Select Folder</span>
        </button>
      </div>

      <button id="home-btn-sample" class="btn-text">Load sample photographs</button>
    </div>

    <footer class="home-footer">
      <span>&copy; 2026 Ayaan Ahmed</span>
    </footer>
  </section>

  <!-- Main Workspace -->
  <main id="workspace" class="workspace hidden">
    <!-- Top Header Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-home-logo" class="brand-btn" title="Add more photos">
          <span class="brand-dot"></span>
          <span class="brand-name">Picture This</span>
        </button>
        <span id="photo-counter" class="photo-counter">0 / 0</span>
      </div>

      <nav class="mode-tabs" aria-label="Editing mode">
        <button class="mode-tab active" data-mode="adjust">
          <i class="ph ph-sliders-horizontal"></i>
          <span>Adjust</span>
        </button>
        <button class="mode-tab" data-mode="crop">
          <i class="ph ph-crop"></i>
          <span>Crop</span>
        </button>
        <button class="mode-tab" data-mode="mask">
          <i class="ph ph-selection-plus"></i>
          <span>Mask</span>
        </button>
        <button class="mode-tab" data-mode="presets">
          <i class="ph ph-swatch-book"></i>
          <span>Presets</span>
        </button>
      </nav>

      <div class="topbar-right">
        <button id="btn-undo" class="icon-btn" title="Undo (Cmd/Ctrl+Z)" disabled>
          <i class="ph ph-arrow-u-up-left"></i>
        </button>
        <button id="btn-redo" class="icon-btn" title="Redo (Cmd/Ctrl+Y)" disabled>
          <i class="ph ph-arrow-u-up-right"></i>
        </button>
        <div class="topbar-divider"></div>
        <button id="btn-copy" class="btn btn-compact" title="Copy settings (Cmd/Ctrl+C)">
          <i class="ph ph-copy"></i>
          <span class="hide-sm">Copy</span>
        </button>
        <button id="btn-paste" class="btn btn-compact" title="Paste settings (Cmd/Ctrl+V)" disabled>
          <i class="ph ph-clipboard-text"></i>
          <span class="hide-sm">Paste</span>
        </button>
        <button id="btn-sync-all" class="btn btn-compact" title="Apply current edits to all photos">
          <i class="ph ph-arrows-clockwise"></i>
          <span class="hide-sm">Sync All</span>
        </button>
        <div class="topbar-divider"></div>
        <button id="btn-add-photos" class="icon-btn" title="Add photos">
          <i class="ph ph-plus"></i>
        </button>
        <button id="btn-add-folder" class="icon-btn" title="Add folder">
          <i class="ph ph-folder-plus"></i>
        </button>
        <button id="btn-open-export" class="btn btn-primary btn-compact">
          <i class="ph ph-export"></i>
          <span>Export</span>
        </button>
      </div>
    </header>

    <!-- Center Stage + Right Inspector -->
    <div class="workbench">
      <!-- Viewport Stage -->
      <section class="stage-column">
        <div id="canvas-stage" class="canvas-stage">
          <div id="canvas-wrap" class="canvas-wrap">
            <canvas id="gl-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
          </div>
        </div>

        <!-- Dedicated Non-Overlapping Utility Bar -->
        <div class="stage-bar">
          <div class="stage-bar-left">
            <button id="btn-toggle-filmstrip" class="bar-btn" title="Toggle Filmstrip">
              <i class="ph ph-film-strip"></i>
              <span>Filmstrip</span>
            </button>
            <span id="file-meta" class="file-meta"></span>
          </div>

          <div class="stage-bar-right">
            <button id="btn-split-wipe" class="bar-btn" title="Split before/after comparison">
              <i class="ph ph-columns"></i>
              <span>Split</span>
            </button>
            <button id="btn-compare-hold" class="bar-btn" title="Hold to view original">
              <i class="ph ph-eye"></i>
              <span>Original</span>
            </button>
            <button id="btn-reset-photo" class="bar-btn" title="Reset all edits on current photo">
              <i class="ph ph-arrow-counter-clockwise"></i>
              <span>Reset</span>
            </button>
            <button id="btn-toggle-inspector" class="bar-btn" title="Toggle Inspector Panel">
              <i class="ph ph-sidebar-simple"></i>
              <span>Panel</span>
            </button>
          </div>
        </div>

        <!-- Collapsible Bottom Filmstrip -->
        <div id="filmstrip-wrap" class="filmstrip-wrap">
          <div id="filmstrip" class="filmstrip"></div>
        </div>
      </section>

      <!-- Collapsible Right Inspector -->
      <aside id="inspector" class="inspector">
        <!-- ADJUST PANEL -->
        <div id="panel-adjust" class="inspector-panel active">
          <div class="panel-top-actions">
            <button id="btn-auto-tone" class="btn btn-secondary btn-full">
              <i class="ph ph-magic-wand"></i>
              <span>Auto Balance</span>
            </button>
          </div>

          <!-- Light Accordion -->
          <div class="accordion open" data-section="light">
            <div class="accordion-header">
              <button class="accordion-trigger" type="button">
                <i class="ph ph-caret-down caret-icon"></i>
                <span>Light</span>
              </button>
              <div class="accordion-tools">
                <button class="mini-icon-btn section-eye" data-section="light" title="Toggle Light adjustments">
                  <i class="ph ph-eye"></i>
                </button>
                <button class="mini-icon-btn section-reset" data-section="light" title="Reset Light">
                  <i class="ph ph-arrow-counter-clockwise"></i>
                </button>
              </div>
            </div>
            <div class="accordion-body" id="sliders-light"></div>
          </div>

          <!-- Color Accordion -->
          <div class="accordion open" data-section="color">
            <div class="accordion-header">
              <button class="accordion-trigger" type="button">
                <i class="ph ph-caret-down caret-icon"></i>
                <span>Color</span>
              </button>
              <div class="accordion-tools">
                <button class="mini-icon-btn section-eye" data-section="color" title="Toggle Color adjustments">
                  <i class="ph ph-eye"></i>
                </button>
                <button class="mini-icon-btn section-reset" data-section="color" title="Reset Color">
                  <i class="ph ph-arrow-counter-clockwise"></i>
                </button>
              </div>
            </div>
            <div class="accordion-body" id="sliders-color"></div>
          </div>

          <!-- Detail & Effects Accordion -->
          <div class="accordion open" data-section="effects">
            <div class="accordion-header">
              <button class="accordion-trigger" type="button">
                <i class="ph ph-caret-down caret-icon"></i>
                <span>Effects</span>
              </button>
              <div class="accordion-tools">
                <button class="mini-icon-btn section-eye" data-section="effects" title="Toggle Effects">
                  <i class="ph ph-eye"></i>
                </button>
                <button class="mini-icon-btn section-reset" data-section="effects" title="Reset Effects">
                  <i class="ph ph-arrow-counter-clockwise"></i>
                </button>
              </div>
            </div>
            <div class="accordion-body" id="sliders-effects"></div>
          </div>
        </div>

        <!-- CROP PANEL -->
        <div id="panel-crop" class="inspector-panel">
          <div class="panel-section">
            <div class="section-label">Aspect Ratio</div>
            <div class="ratio-grid">
              <button class="ratio-btn active" data-ratio="free">Free</button>
              <button class="ratio-btn" data-ratio="original">Original</button>
              <button class="ratio-btn" data-ratio="1:1">1:1</button>
              <button class="ratio-btn" data-ratio="4:5">4:5</button>
              <button class="ratio-btn" data-ratio="3:2">3:2</button>
              <button class="ratio-btn" data-ratio="16:9">16:9</button>
              <button class="ratio-btn" data-ratio="21:9">21:9</button>
              <button id="btn-swap-ratio" class="ratio-btn" title="Swap orientation">
                <i class="ph ph-arrows-left-right"></i> Swap
              </button>
            </div>
          </div>

          <div class="panel-section">
            <div class="slider-row">
              <div class="slider-header">
                <span class="slider-label">Straighten</span>
                <span id="val-rotate-fine" class="slider-val">0.0°</span>
              </div>
              <input type="range" id="slider-rotate-fine" class="studio-range" min="-45" max="45" step="0.1" value="0" />
            </div>
          </div>

          <div class="panel-section">
            <div class="section-label">Transform</div>
            <div class="transform-row">
              <button id="btn-rot-left" class="btn btn-secondary" title="Rotate 90° Left">
                <i class="ph ph-arrow-counter-clockwise"></i>
                <span>90° L</span>
              </button>
              <button id="btn-rot-right" class="btn btn-secondary" title="Rotate 90° Right">
                <i class="ph ph-arrow-clockwise"></i>
                <span>90° R</span>
              </button>
              <button id="btn-flip-h" class="btn btn-secondary" title="Flip Horizontal">
                <i class="ph ph-flip-horizontal"></i>
              </button>
              <button id="btn-flip-v" class="btn btn-secondary" title="Flip Vertical">
                <i class="ph ph-flip-vertical"></i>
              </button>
            </div>
          </div>

          <div class="panel-section">
            <button id="btn-reset-crop" class="btn btn-secondary btn-full">
              <i class="ph ph-arrow-counter-clockwise"></i>
              <span>Reset Crop &amp; Rotation</span>
            </button>
          </div>
        </div>

        <!-- MASK PANEL -->
        <div id="panel-mask" class="inspector-panel">
          <div class="panel-section">
            <div class="section-label">Create Mask</div>
            <div class="mask-create-row">
              <button id="btn-add-linear" class="btn btn-secondary">
                <i class="ph ph-gradient"></i>
                <span>Linear</span>
              </button>
              <button id="btn-add-radial" class="btn btn-secondary">
                <i class="ph ph-circle-dashed"></i>
                <span>Radial</span>
              </button>
              <button id="btn-add-brush" class="btn btn-secondary">
                <i class="ph ph-paint-brush"></i>
                <span>Brush</span>
              </button>
            </div>
          </div>

          <div class="panel-section">
            <div class="mask-list-header">
              <span class="section-label">Masks</span>
              <label class="toggle-inline">
                <input type="checkbox" id="chk-mask-overlay" />
                <span>Show Overlay</span>
              </label>
            </div>
            <div id="mask-list" class="mask-list"></div>
          </div>

          <div id="mask-controls-wrap" class="panel-section hidden">
            <div class="mask-options-bar">
              <label class="toggle-inline">
                <input type="checkbox" id="chk-mask-invert" />
                <span>Invert Mask</span>
              </label>
              <button id="btn-delete-mask" class="btn-danger-text">
                <i class="ph ph-trash"></i> Delete
              </button>
            </div>

            <div id="brush-controls" class="brush-controls hidden">
              <div class="slider-row">
                <div class="slider-header">
                  <span class="slider-label">Brush Size</span>
                  <span id="val-brush-size" class="slider-val">60</span>
                </div>
                <input type="range" id="slider-brush-size" class="studio-range" min="10" max="200" step="1" value="60" />
              </div>
              <div class="brush-mode-row">
                <button id="btn-brush-paint" class="btn btn-secondary active">Paint</button>
                <button id="btn-brush-erase" class="btn btn-secondary">Erase</button>
                <button id="btn-brush-clear" class="btn btn-secondary">Clear</button>
              </div>
            </div>

            <div id="sliders-mask" class="mask-sliders"></div>
          </div>
        </div>

        <!-- PRESETS PANEL -->
        <div id="panel-presets" class="inspector-panel">
          <div class="panel-section">
            <div class="section-label">Looks</div>
            <div id="preset-grid" class="preset-grid"></div>
          </div>

          <div class="panel-section">
            <div class="section-label">Custom Presets</div>
            <div class="save-preset-row">
              <input type="text" id="input-preset-name" class="text-input" placeholder="Preset name..." />
              <button id="btn-save-preset" class="btn btn-secondary">Save</button>
            </div>
            <div id="user-preset-list" class="preset-grid"></div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Minimal Footer -->
    <footer class="app-footer">
      <span>&copy; 2026 Ayaan Ahmed</span>
      <span id="status-msg" class="status-msg"></span>
    </footer>
  </main>

  <!-- Export Modal -->
  <div id="export-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Export Photographs</h2>
        <button id="btn-close-export" class="icon-btn">
          <i class="ph ph-x"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-row">
          <label>Target</label>
          <select id="export-scope" class="select-input">
            <option value="all">All Photographs in Queue</option>
            <option value="current">Current Photograph Only</option>
          </select>
        </div>

        <div class="form-row">
          <label>Format</label>
          <div class="format-pills">
            <button type="button" class="format-pill active" data-format="image/webp">WebP</button>
            <button type="button" class="format-pill" data-format="image/jpeg">JPEG</button>
            <button type="button" class="format-pill" data-format="image/png">PNG</button>
          </div>
        </div>

        <div id="export-quality-row" class="form-row">
          <div class="slider-header">
            <label>Quality</label>
            <span id="val-export-quality" class="slider-val">90%</span>
          </div>
          <input type="range" id="slider-export-quality" class="studio-range" min="10" max="100" step="1" value="90" />
        </div>

        <div class="form-row">
          <label>Resize Long Edge</label>
          <select id="export-resize" class="select-input">
            <option value="0">Original Resolution</option>
            <option value="3840">3840 px (4K)</option>
            <option value="2560">2560 px (QHD)</option>
            <option value="1920">1920 px (Full HD)</option>
            <option value="1280">1280 px (Web)</option>
          </select>
        </div>

        <div class="form-row">
          <label>Filename Prefix (Optional)</label>
          <input type="text" id="export-prefix" class="text-input" placeholder="e.g. shoot-01_" />
        </div>

        <div id="export-progress-wrap" class="export-progress hidden">
          <div class="progress-track">
            <div id="export-progress-bar" class="progress-fill"></div>
          </div>
          <span id="export-progress-text" class="progress-text">Processing...</span>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-export-folder" class="btn btn-secondary">
          <i class="ph ph-folder-Simple-arrow-down"></i>
          <span>Save to Folder</span>
        </button>
        <button id="btn-export-zip" class="btn btn-primary">
          <i class="ph ph-download-simple"></i>
          <span>Download</span>
        </button>
      </div>
    </div>
  </div>

  <!-- External Libraries: Anime.js & fflate -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script src="./app.js"></script>
</body>
</html>
